<style>
:root{--ink:#193748;--muted:#576e7b;--line:#dae5e9;--paper:#f8fafb;--teal:#087f8c;--red:#c25136;--blue:#276fba;--gold:#f0bf55}
*{box-sizing:border-box}body{margin:0;background:#172936;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif}main{max-width:1040px;margin:auto;padding:1px 0}.frame{position:relative;margin:24px 0;overflow:hidden;box-shadow:0 8px 35px #071a2355}.slide{width:960px;height:720px;padding:34px 42px;background:var(--paper);position:relative;transform-origin:0 0;overflow:hidden}.eyebrow{display:flex;justify-content:space-between;align-items:center;color:var(--teal);font-size:13px;font-weight:700;letter-spacing:1px}h1{font-size:33px;line-height:1.3;letter-spacing:.01em;margin:18px 0 9px}.subtitle{font-size:18px;line-height:1.6;color:var(--muted);margin:0 0 20px}h2{font-size:21px;margin:0 0 10px;line-height:1.5}p{font-size:18px;line-height:1.65;margin:8px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:20px;border:1px solid var(--line);border-radius:16px;background:#fff}.figure{background:#eef3f5;border-radius:16px;padding:12px}.small{font-size:14px;color:var(--muted);line-height:1.6}.tiny{font-size:12px;color:var(--muted);line-height:1.65}.caption{font-size:14px;text-align:center;color:var(--muted);margin-top:4px}.pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:700;background:#e3eff1;color:var(--teal)}.takeaway{padding:16px 20px;border-radius:12px;background:#e1f0f0;font-size:21px;line-height:1.5;font-weight:700;margin-top:18px}.note{background:#fff0d2;border-left:4px solid var(--gold);padding:12px 15px;font-size:14px;line-height:1.7;margin-top:14px}.formula{font-family:Georgia,"Times New Roman","Noto Sans JP","Yu Gothic",Meiryo,serif;font-size:32px;line-height:1.5;padding:16px 18px;border-radius:12px;background:#e6f2f3;margin:12px 0}.formula small{font-size:14px;font-family:inherit;color:var(--muted);display:block}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;margin:0 5px;line-height:1.22}.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 8px 4px}.frac span:last-child{padding:4px 8px 0}.teal{color:var(--teal)}.blue{color:var(--blue)}.red{color:var(--red)}.number{font-weight:800;font-variant-numeric:tabular-nums}.foot{position:absolute;left:42px;right:42px;bottom:18px;border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.progress{display:flex;gap:4px}.progress i{width:15px;height:3px;background:#d5e1e6}.progress i.on{background:var(--teal)}svg{width:100%;height:auto;display:block}svg text{font-family:inherit;font-size:18px;fill:var(--ink)}svg .s{font-size:14px}svg .big{font-size:24px;font-weight:700}svg .white{fill:white}table{border-collapse:collapse;width:100%;font-size:17px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:center}th{font-size:14px;background:#eaf0f3;color:var(--muted)}tr.selected{background:#dcf0ec;font-weight:700}.step{display:flex;gap:16px;align-items:center;padding:13px 17px;background:white;border:1px solid var(--line);border-radius:12px;margin-bottom:9px}.step .badge{flex-shrink:0;display:grid;place-items:center;width:37px;height:37px;background:var(--teal);color:white;border-radius:50%;font-weight:700}.step h2{font-size:19px;margin:0}.step p{font-size:14px;margin:3px 0 0;color:var(--muted)}.equationRow{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:center;margin:14px 0}.equationRow .formula{margin:0;font-size:24px;padding:12px}.sources a{color:var(--teal);text-underline-offset:3px}label{font-size:13px;color:var(--muted);display:block}input{width:100%;display:block;background:white;border:1px solid #b6c9d3;border-radius:7px;padding:7px 9px;color:var(--ink);font:600 19px inherit;font-family:inherit;font-size:19px;margin-top:4px;font-variant-numeric:tabular-nums}input:focus{outline:2px solid var(--teal);outline-offset:1px}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.inputs.secondary{grid-template-columns:repeat(2,1fr);gap:8px}.secondary input{padding:5px 8px;font-size:17px}.input-title{font-size:14px;font-weight:700;margin:14px 0 9px}button{font:inherit;font-size:13px;background:#e5eef1;color:var(--ink);border:1px solid #c1d2da;border-radius:6px;padding:7px 12px;cursor:pointer}button:hover{background:#d0e5e7}.status{font-size:19px;padding:12px;border-radius:9px;background:#e0f2e9;color:#19664b;line-height:1.4;margin:0 0 12px}.status.bad{background:#ffebe4;color:#9d381f}.metric{font-size:15px;margin:8px 0}.track{height:10px;background:#e4ebef;border-radius:5px;position:relative;margin:5px 0 11px}.track i{display:block;height:100%;border-radius:5px;background:var(--teal)}.calc-table{font-size:14px}.calc-table th,.calc-table td{padding:7px 4px}.ok{color:#19664b}.bad{color:#a03924}.source-line{margin-top:13px}.calc-result .formula{font-size:23px;padding:10px 12px}.mini-label{font-size:13px;color:var(--muted)}.example-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.example-cells .card{padding:15px}.example-cells .value{font-size:28px;font-weight:800;line-height:1.5}.example-cells p{font-size:14px}.example-cells .calc{font-size:18px;line-height:1.6}.equal{font-size:20px;font-weight:700}.condition{font-size:15px;background:#eaf0f3;padding:12px 16px;border-radius:10px;margin:0 0 15px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.p8 .formula{padding:8px 16px!important;margin:8px 0 12px!important;font-size:24px!important}.p8 .example-cells .card{padding:12px}.p8 .example-cells p{margin:4px 0}.p8 .example-cells .value{font-size:26px;line-height:1.3}.p8 .takeaway{padding:11px 16px;margin-top:12px}.p8 .condition{padding:9px 14px;margin-bottom:10px}.p9 .track{margin:3px 0 7px;height:8px}.p9 .calc-result p{margin:5px 0}.p9 .calc-result .formula{margin:8px 0;padding:8px 10px}.p9 .status{padding:9px 11px;margin-bottom:8px}.p9 .calc-table td,.p9 .calc-table th{padding:6px 4px}.p5 .takeaway{margin-top:12px;padding:13px 18px}.p7 .equationRow{margin:10px 0}
.p4 .formula{padding:11px 16px;margin:9px 0}.p4 .note{margin-top:10px}.p9 .card{padding:14px!important}.p9 .inputs{gap:8px}.p9 input{padding:5px 8px;font-size:18px}.p9 .secondary input{padding:4px 8px;font-size:16px}.p9 .inputs.secondary{gap:6px}.p9 .input-title{margin:10px 0 6px}.p9 .status{font-size:17px;padding:8px 10px}.p9 .calc-table td,.p9 .calc-table th{padding:5px 4px}.p9 .mini-label{line-height:1.4}.p9 .calc-result .formula{font-size:21px;line-height:1.4}.p9 .calc-result .formula small{font-size:12px}.p9 .metric{margin:6px 0}.p9 #guidance{font-size:11px}
@media(max-width:600px){.frame{margin:12px 0}}
@media print{body{background:white}main{padding:0;max-width:none}.frame{width:960px!important;height:720px!important;margin:0!important;box-shadow:none;break-after:page}.slide{transform:none!important}button{display:none}@page{size:254mm 190.5mm;margin:0}}

.sim-grid{display:grid;grid-template-columns:268px 1fr;gap:20px}.sim-controls{padding:15px;background:white;border:1px solid var(--line);border-radius:13px}.sim-controls select{width:100%;font:600 18px inherit;font-family:inherit;font-size:18px;padding:7px;border:1px solid #aac0cb;border-radius:7px;margin:4px 0 7px;background:white;color:var(--ink)}.check{display:flex;gap:6px;align-items:center;font-size:12px}.check input{width:15px;height:15px;margin:0;padding:0;accent-color:var(--teal)}.control{margin:10px 0}.control>label{font-weight:600}.control-row{display:grid;grid-template-columns:1fr 74px;gap:9px;align-items:center}.control-row input[type=number]{padding:4px 6px;font-size:17px}.control-row input[type=range]{padding:0;margin:0;width:100%;height:25px;accent-color:var(--teal);cursor:pointer}.sim-controls button{margin-top:4px}.sim-controls .tiny{font-size:11px;line-height:1.5;margin:5px 0}.live-figure{background:#edf3f5;border-radius:14px;margin-bottom:10px}.live-figure svg text{font-size:15px}.live-figure svg .s{font-size:13px}.sf-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sf-card{background:white;border:1px solid var(--line);border-radius:10px;padding:10px 9px;font-size:13px}.sf-card strong{display:block;font-size:27px;font-variant-numeric:tabular-nums}.sf-card small{font-size:11px}.sf-track{height:9px;background:#e0e8ed;border-radius:4px;position:relative;margin:6px 0}.sf-track i{height:100%;display:block;border-radius:4px}.sf-track b{position:absolute;left:50%;top:-3px;height:15px;border-left:2px solid #193748}.sim-status{font-size:18px;font-weight:700;line-height:1.5;padding:9px 12px;margin:10px 0 5px;background:#e0f1e9;border-radius:9px;color:#166448}.sim-status.bad{background:#ffebe4;color:#a03924}.sim-foot{margin-top:10px;line-height:1.5}.p9 .subtitle{margin-bottom:14px}.invalid-figure{height:266px;display:grid;place-items:center;color:var(--muted)}.basis-row{display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:center;margin:9px 0}.basis-row input{font-size:17px;padding:6px}.basis h2{font-size:19px}.basis .tiny{font-size:12px}.p10 .formula{margin:0 0 12px}.p10 .card{padding:17px}.p10 .note{font-size:13px;line-height:1.65;padding:10px 13px;margin-top:11px}.p10 .small{font-size:13px;line-height:1.7}.p10 .subtitle{margin-bottom:16px}.p8 .tiny{font-size:11px}.p5 .takeaway{padding:10px 18px}.p5 .small{font-size:13px}
.sim-controls .control{margin:6px 0}.sim-controls select{padding:5px 7px}.live-figure svg{height:234px}.sim-controls .control-row input[type=number]{padding:3px 6px}.p10>.content>.two>div>.formula{padding:9px 13px!important}.p10 #basisResult{padding:13px}.p10 #basisResult p{margin:6px 0}.p10 #basisResult h2{font-size:17px!important}.p10 .note{font-size:12px;line-height:1.6}.p10 .basis-row{margin:7px 0}.sim-controls{padding:12px}.p9 .sim-foot{font-size:11px;margin-top:8px}.sim-controls button{font-size:12px}</style>

<body>
<main id="deck"></main>
<noscript>この説明ページの表示にはJavaScriptを有効にしてください。</noscript>
<script>
'use strict';
const deck=document.getElementById('deck');
let serial=0;
const frac=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
function page(n,section,title,subtitle,body){deck.insertAdjacentHTML('beforeend',`<div class="frame"><section class="slide p${n}" aria-label="${n}. ${title}"><div class="eyebrow"><span>図でわかる 平行キー</span><span>${section}</span></div><h1>${title}</h1><p class="subtitle">${subtitle}</p><div class="content">${body}</div><footer class="foot"><span>選び方から強度計算まで</span><span class="progress" aria-hidden="true">${Array.from({length:10},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span><span>${n} / 10</span></footer></section></div>`)}
function svg(title,body,h=340){const id=++serial;return `<svg viewBox="0 0 420 ${h}" role="img" aria-label="${title}"><defs><marker id="a${id}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c25136"/></marker><marker id="b${id}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker></defs>${body.replaceAll('ARR',`url(#a${id})`).replaceAll('TEAL',`url(#b${id})`)}</svg>`}
function shaft(force=false){return svg('軸とハブの断面。黄色いキーを介して回転を伝える',`<circle cx="195" cy="170" r="137" fill="#d9e2e7" stroke="#8099a7" stroke-width="2"/><circle cx="195" cy="170" r="86" fill="#a7cbd7" stroke="#547f91" stroke-width="2"/><path d="M170 87V124H220V87" fill="#f9fafb" stroke="#547f91"/><rect x="170" y="56" width="50" height="66" fill="#f0bf55" stroke="#ab7c2a" stroke-width="2"/><path d="M168 83V51H222V83" fill="none" stroke="#8099a7" stroke-width="2"/><circle cx="195" cy="170" r="4" fill="#193748"/><text x="177" y="223">軸</text><text x="253" y="270">ハブ</text><path d="M226 56L280 30H361" fill="none" stroke="#a67d32"/><text x="288" y="23">キー</text>${force?`<path d="M195 170V84" stroke="#687d88" stroke-width="2" stroke-dasharray="5 4"/><text x="210" y="146">半径 d/2</text><path d="M195 84H338" stroke="#c25136" stroke-width="4" marker-end="ARR"/><text x="284" y="69" class="big">力 F</text><path d="M242 241A85 85 0 0 1 117 210" fill="none" stroke="#c25136" stroke-width="3" marker-end="ARR"/><text x="60" y="318">トルク T：軸を回す作用</text>`:`<path d="M72 115A137 137 0 0 1 133 48" fill="none" stroke="#c25136" stroke-width="3" marker-end="ARR"/><text x="25" y="159">回転</text><text x="99" y="331" class="s">軸の端から見た断面図</text>`}`)}
function prism(shear=false){return svg(shear?'キーを切ろうとするせん断面は、幅bと有効長さleの積':'両角形平行キーの幅、高さ、長さ',`<path d="M68 130H295L363 77H136Z" fill="#ffe4a1" stroke="#ab7c2a" stroke-width="2"/><path d="M68 130H295V224H68Z" fill="#f0bf55" stroke="#ab7c2a" stroke-width="2"/><path d="M295 130L363 77V171L295 224Z" fill="#dba741" stroke="#ab7c2a" stroke-width="2"/>${shear?`<path d="M68 180H295L363 127H136Z" fill="#276fba" fill-opacity=".85" stroke="#195b9b" stroke-width="2"/><path d="M130 125L188 80M247 214L195 255" fill="none" stroke="#c25136" stroke-width="3" marker-end="ARR"/><text x="119" y="164" class="white">切れようとする面</text>`:''}<path d="M68 248H295M68 237V257M295 237V257M313 242L381 189M35 130V224M27 130H47M27 224H47" fill="none" stroke="#617d89" stroke-width="1.5"/><text x="145" y="276">${shear?'有効長さ lₑ':'長さ l'}</text><text x="348" y="238">幅 b</text><text x="5" y="183">h</text><text x="122" y="316" class="s">${shear?'青い面の面積 ＝ b × lₑ':'h：高さ ／ 両端が四角い「両角形」'}</text>`)}
function pressure(){return svg('キー断面の拡大。ハブ側と軸側の反対の側面に力が働く',`<path d="M38 43H382V160H231V90H129V160H38Z" fill="#dce4e9" stroke="#8da0a9"/><path d="M38 160H130V251H230V160H382V305H38Z" fill="#b8d7e0" stroke="#668c9b"/><rect x="131" y="100" width="98" height="150" fill="#f6cf77" stroke="#ab7c2a" stroke-width="2"/><path d="M131 160H229" stroke="#276fba" stroke-width="2" stroke-dasharray="6 4"/><path d="M130 165V246" stroke="#087f8c" stroke-width="7"/><path d="M230 103V155" stroke="#c25136" stroke-width="7"/><path d="M54 204H125" stroke="#087f8c" stroke-width="3" marker-end="TEAL"/><path d="M307 126H236" stroke="#c25136" stroke-width="3" marker-end="ARR"/><text x="52" y="188" class="s">軸が押す</text><text x="258" y="109" class="s">ハブが押す</text><text x="304" y="68">ハブ</text><text x="315" y="281">軸</text><text x="155" y="222">キー</text><path d="M91 164V250M85 164H99M85 250H99M344 100V159M338 100H350M338 159H350" fill="none" stroke="#193748"/><text x="65" y="240">tₛ</text><text x="359" y="137">tₕ</text><path d="M180 94V28H87" fill="none" stroke="#617d89"/><text x="50" y="20" class="s">上部すきま：力を受けない</text><text x="54" y="334" class="s">接触部の模式図（軸表面を平面として表示）</text>`)}
page(1,'まず仕組み','キーは、軸とハブを一緒に回す部品','溝にはめたキーの「側面」で、回転する力を伝えます。',`<div class="two"><div class="figure">${shaft()}</div><div><div class="card"><span class="pill">力が伝わる順番</span><h2 style="margin-top:13px">軸 → キー → ハブ</h2><p>ハブは、歯車やプーリの<br>軸に取り付く部分です。</p></div><div class="card" style="margin-top:15px"><h2>強度で確認するのは2つ</h2><p><b class="blue">① せん断：切れないか？</b><br><b class="red">② 面圧：つぶれないか？</b></p><p class="small">キーだけでなく、相手の溝も確認します。</p></div></div></div><div class="takeaway">幅・高さを選んだら、力に耐える「長さ」を決める。</div>`);
page(2,'選定の流れ','幅・高さは軸径から、長さは強度から','最初に規格で仮選定し、その後で計算します。',`<div class="step"><span class="badge">1</span><div><h2>軸径と、既存のキー溝を確認</h2><p>モータなどの溝が決まっている場合は、その幅・深さに合わせる。</p></div></div><div class="step"><span class="badge">2</span><div><h2>JIS表で「幅 b × 高さ h」を選ぶ</h2><p>表の適応軸径は一般用途の目安。これだけで強度OKにはならない。</p></div></div><div class="step"><span class="badge">3</span><div><h2>トルクと、材料が耐えられる許容値を決める</h2><p>起動・加減速・正逆転を考慮し、キー・軸・ハブの材質を確認。</p></div></div><div class="step"><span class="badge">4</span><div><h2>せん断・面圧から必要な長さを計算</h2><p>3条件の必要長さを比べ、最も長いものを満たすように選ぶ。</p></div></div><div class="step"><span class="badge">5</span><div><h2>取り付けられるか確認して決定</h2><p>ハブ内の接触長さ、溝、はめあいを確認。不足なら寸法や材質を見直す。</p></div></div><p class="small">軸そのものの強度・キー溝の応力集中・疲労は、別途確認します。</p>`);
page(3,'寸法を選ぶ','JIS表の「5 × 5」を読む','幅5 mm、高さ5 mm。長さは別に選びます。',`<div class="two" style="grid-template-columns:1.45fr 1fr"><div><table><thead><tr><th>幅 × 高さ</th><th>参考軸径 d</th><th>長さ l</th></tr></thead><tbody>${[['4 × 4','10 &lt; d ≤ 12','8～45'],['5 × 5','12 &lt; d ≤ 17','10～56'],['6 × 6','17 &lt; d ≤ 22','14～70'],['8 × 7','22 &lt; d ≤ 30','18～90'],['10 × 8','30 &lt; d ≤ 38','22～110']].map((r,i)=>`<tr class="${i===1?'selected':''}">${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="tiny">単位：mm。JIS B 1301:1996のメーカー公開表から抜粋。</p></div><div class="figure">${prism()}</div></div><div class="note"><b>今回のキー：5 × 5 × 15 mm ／ 両角形</b><br>5×5の推奨長さ：10、12、14、16、18、20、22、25、28、32、36、40、45、50、56 mm。<br>15 mmは10～56 mmの範囲内ですが、推奨系列外です。今回は指定長さとして扱います。</div><p class="tiny sources source-line">出典：<a href="https://www.khkgears.co.jp/gear_technology/gear_reference/khk495/" target="_blank" rel="noopener">KHK「キー及びキー溝」</a> ／ <a href="https://jp.misumi-ec.com/tech-info/categories/technical_data/td01/a0061.html" target="_blank" rel="noopener">MISUMI「沈みキー及びキー溝」</a>。新旧JISを混用せず、許容差・はめあいは採用品の図面で確認。</p>`);
page(4,'力を求める','トルクを「キーを押す力」に換算する','トルクは、力と回転中心からの距離の掛け算です。',`<div class="two"><div class="figure">${shaft(true)}<p class="caption">力の作用半径を d/2 とする基本モデル</p></div><div><p>トルク ＝ 力 × 半径</p><div class="formula">1000 T = F × ${frac('d','2')}</div><p>力 F を求める形にすると、</p><div class="formula"><b>F = ${frac('2000 T','d')}</b></div><p class="small">T：設計に使うトルク [N·m]<br>d：軸径 [mm]　F：力 [N]<br>1000は N·m → N·mm の単位換算。</p></div></div><div class="note">Tには定格値だけでなく、起動・加減速などの負荷を考慮。動力からは T ≈ 9550 P / n（P：kW、n：min⁻¹、n &gt; 0）。使用係数の重複適用を避けます。</div>`);
page(5,'切れないか確認','せん断は「幅 × 有効長さ」で受ける','同じ力でも、受ける面積が大きいほど応力は小さくなります。',`<div class="two"><div class="figure">${prism(true)}<p class="caption">せん断面：軸とハブの境目に相当する面</p></div><div><span class="pill">せん断応力 ＝ 力 ÷ 面積</span><div class="formula blue">τ = ${frac('F','b × lₑ')}</div><p>τ：せん断応力 [MPa]<br>b：幅 [mm]　lₑ：有効長さ [mm]</p><div class="card" style="margin-top:16px"><h2>判定は、許容値と比較</h2><p class="equal">τ ≤ 許容せん断応力 τₐ</p><p class="small">許容値は材質・熱処理・荷重条件から設定。</p></div></div></div><div class="takeaway">lₑ は、軸とハブの双方で力を伝える長さ。</div><p class="small">両角形でも、全長がかみ合う場合だけ lₑ = l。はみ出し・逃げ部分は除きます。1 MPa = 1 N/mm²。</p>`);
page(6,'つぶれないか確認','面圧は「接触高さ × 有効長さ」で受ける','軸側とハブ側で、高さや相手の材質が違うため、両方を計算します。',`<div class="two"><div class="figure">${pressure()}</div><div><div class="formula teal" style="font-size:28px">軸側　pₛ = ${frac('F','tₛ × lₑ')}</div><div class="formula red" style="font-size:28px;background:#fbece5">ハブ側 pₕ = ${frac('F','tₕ × lₑ')}</div><p class="small">tₛ、tₕ：各側の有効接触高さ [mm]<br>pₛ、pₕ：面圧 [MPa]</p><p><b>それぞれの許容面圧以下か確認。</b></p><p class="small">許容面圧は、キーと相手材の双方を考慮。キーだけ強くしても、溝がつぶれる場合があります。</p></div></div><div class="note"><b>溝の深さと接触高さは別。</b> 平面近似では軸側 ≈ t₁、ハブ側 ≈ h − t₁。<br>ハブ溝深さ t₂ には上部すきまを含みます。実際は面取り・曲率・公差等を反映した有効高さを使います。</div>`);
page(7,'長さを決める','3つの必要長さのうち、最大を採用','「応力 ≤ 許容値」を、必要な長さの式に変形します。',`<div class="equationRow"><b class="blue">① せん断</b><div class="formula">lτ = ${frac('F','b × τₐ')}</div></div><div class="equationRow"><b class="teal">② 軸側の面圧</b><div class="formula">lₛ = ${frac('F','tₛ × pₐₛ')}</div></div><div class="equationRow"><b class="red">③ ハブ側の面圧</b><div class="formula">lₕ = ${frac('F','tₕ × pₐₕ')}</div></div><div class="takeaway">必要有効長さ l_req = max(lτ, lₛ, lₕ)<br>取り付けたときの lₑ が、この長さ以上なら成立。</div><p class="small">τₐ：許容せん断応力 ／ pₐₛ、pₐₕ：軸側・ハブ側の許容面圧（単位：MPa）<br>許容値には必要な安全余裕を含めます。長いキーでは荷重の偏りも確認します。</p><p class="tiny sources">式の参考：<a href="https://www.eng-book.com/ebw/IntensityOfKey_shear_calculation.do?category=shear" target="_blank" rel="noopener">兵神装備「キーの強さ」</a>。本資料は1本のキー・均等荷重の基本計算です。</p>`);
page(8,'数値を代入','例題：5 × 5 × 15 mmで計算する','両角形で全長がかみ合うため、有効長さ lₑ = 15 mm とします。',`<div class="condition"><b>仮定：</b>軸径 d = 14 mm ／ トルク T = 10 N·m ／ 接触高さ tₛ = 3、tₕ = 2 mm</div><div class="formula" style="font-size:26px;margin-bottom:18px">まず力を求める　F = ${frac('2000 × 10','14')} = <b>1428.6 N</b></div><div class="example-cells"><div class="card"><span class="pill blue">① せん断</span><p class="calc">面積：5 × 15 = 75<br>τ = 1428.6 ÷ 75</p><div class="value blue">19.05 <span style="font-size:16px">MPa</span></div><p>仮の許容値：40 MPa<br><b>19.05 ≤ 40</b></p></div><div class="card"><span class="pill teal">② 軸側の面圧</span><p class="calc">面積：3 × 15 = 45<br>pₛ = 1428.6 ÷ 45</p><div class="value teal">31.75 <span style="font-size:16px">MPa</span></div><p>仮の許容値：80 MPa<br><b>31.75 ≤ 80</b></p></div><div class="card"><span class="pill red">③ ハブ側の面圧</span><p class="calc">面積：2 × 15 = 30<br>pₕ = 1428.6 ÷ 30</p><div class="value red">47.62 <span style="font-size:16px">MPa</span></div><p>仮の許容値：60 MPa<br><b>47.62 ≤ 60</b></p></div></div><div class="takeaway" style="font-size:19px">必要長さは 7.14、5.95、11.90 mm → 最大11.90 mm。<br>安全率は4.20、5.04、2.52。最小2.52 ≥ 必要安全率2。</div><p class="tiny">許容値40/80/60 MPaは、仮の基準強さ80/160/120 MPaを必要安全率2で割った教材用の値です。接触高さ3/2 mmは t₁=3、h=5 の公称近似です。5×5の溝寸法は t₁=3.0、t₂=2.3 mm（前掲のJIS抜粋）。実機では有効高さ・材料・使用条件の確認が必要です。</p>`);
const keys=[
 {b:4,h:4,d0:10,d1:12,min:8,max:45,t1:2.5,t2:1.8},
 {b:5,h:5,d0:12,d1:17,min:10,max:56,t1:3,t2:2.3},
 {b:6,h:6,d0:17,d1:22,min:14,max:70,t1:3.5,t2:2.8},
 {b:8,h:7,d0:22,d1:30,min:18,max:90,t1:4,t2:3.3},
 {b:10,h:8,d0:30,d1:38,min:22,max:110,t1:5,t2:3.3},
 {b:12,h:8,d0:38,d1:44,min:28,max:140,t1:5,t2:3.3}
];
function control(id,label,value,min,max,step){return `<div class="control"><label for="${id}">${label}</label><div class="control-row"><input id="${id}bar" type="range" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${label}のスライダー"><input id="${id}" type="number" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${label}の数値入力"></div></div>`}
page(9,'動かして確認','寸法・力・安全率を、その場で比較','バーを動かすと、断面図・キー形状・力の矢印・判定が連動します。',`<div class="sim-grid"><div class="sim-controls"><label for="key">両角形キー：幅 × 高さ [mm]</label><select id="key">${keys.map((k,i)=>`<option value="${i}" ${i===1?'selected':''}>${k.b} × ${k.h}</option>`).join('')}</select><label class="check"><input id="auto" type="checkbox" checked>軸径からキーを自動選択</label><p id="recommend" class="tiny"></p>${control('d','軸径 d [mm]',14,10.1,44,.1)}${control('T','設計トルク T [N·m]',10,0,100,.5)}${control('L','全長＝有効長さ lₑ [mm]',15,10,56,1)}${control('nreq','必要安全率 n_req',2,1,5,.1)}<button id="reset" type="button">5 × 5 × 15 の例題に戻す</button><p id="lengthNote" class="tiny"></p></div><div><div id="liveFigure" class="live-figure"></div><div id="results" aria-live="polite"></div></div></div><p class="tiny sim-foot">基準強さ・接触高さは次ページで設定。初期値は教材用の仮定です。図は寸法変化を強調した模式図（縮尺不定・矢印に上限）。</p>`);
page(10,'判定の根拠','安全率 ＝ 基準強さ ÷ 計算した応力','必要安全率を下回る項目が1つでもあれば、条件を満たしません。',`<div class="two"><div class="card basis"><h2>基準強さを設定 [MPa]</h2><p class="tiny">安全率で割る前の値を入力。許容値の再入力による二重の安全率適用を避けます。</p><div class="basis-row"><label for="refTau">キーのせん断基準強さ τ₀</label><input id="refTau" type="number" min="0.01" max="10000" step="any" value="80"></div><div class="basis-row"><label for="refS">軸側の面圧基準値 p₀ₛ</label><input id="refS" type="number" min="0.01" max="10000" step="any" value="160"></div><div class="basis-row"><label for="refH">ハブ側の面圧基準値 p₀ₕ</label><input id="refH" type="number" min="0.01" max="10000" step="any" value="120"></div><p class="tiny">材質・熱処理・荷重条件に適合する値を使用。面圧基準値はキーと相手材の双方から設定します。</p><h2 style="font-size:18px;margin-top:14px">有効接触高さ [mm]</h2><div class="inputs" style="grid-template-columns:1fr 1fr"><label>軸側 tₛ<input id="ts" type="number" min="0.01" step="any" value="3"></label><label>ハブ側 tₕ<input id="th" type="number" min="0.01" step="any" value="2"></label></div><p id="heightNote" class="tiny"></p></div><div><div class="formula" style="font-size:23px;padding:13px">nτ = ${frac('τ₀','τ')}　nₛ = ${frac('p₀ₛ','pₛ')}　nₕ = ${frac('p₀ₕ','pₕ')}</div><div id="basisResult" class="card"></div><div class="note">初期の基準強さは<b>材質未指定の教材用</b>で、実機の保証値ではありません。接触高さは面取り・曲率・公差を考慮。キー変更時は公称近似に戻ります。</div></div></div>`);
const el=id=>document.getElementById(id),basic=['d','T','L','nreq'],basis=['refTau','refS','refH','ts','th'];
const names=['せん断','軸側面圧','ハブ側面圧'];
const fmt=(x,d=2)=>x===Infinity?'∞':Math.abs(x)>=1e6||Math.abs(x)>0&&Math.abs(x)<.01?x.toExponential(2):x.toFixed(d);
const currentKey=()=>keys[Number(el('key').value)];
function model(k,d,T,L,ts,th,refs,nreq){const F=2000*T/d,stress=[F/(k.b*L),F/(ts*L),F/(th*L)],safety=stress.map((v,i)=>v===0?Infinity:refs[i]/v),need=[F*nreq/(k.b*refs[0]),F*nreq/(ts*refs[1]),F*nreq/(th*refs[2])];return {F,stress,safety,need,required:Math.max(...need),minimum:Math.min(...safety)}}
function configureKey(){const k=currentKey();['L','Lbar'].forEach(id=>{el(id).min=k.min;el(id).max=k.max});let value=Number(el('L').value);if(Number.isFinite(value)&&el('L').value!==''){value=Math.min(k.max,Math.max(k.min,value));el('L').value=el('Lbar').value=value}el('ts').value=k.t1;el('th').value=Number((k.h-k.t1).toFixed(2));el('ts').max=k.t1;el('th').max=k.h-k.t1}
function selectFromDiameter(){if(!el('auto').checked)return;const d=Number(el('d').value),i=keys.findIndex(k=>d>k.d0&&d<=k.d1);if(i>=0&&i!==Number(el('key').value)){el('key').value=i;configureKey()}}
function live(k,d,T,L,m,ts,th,pass){
 const cx=122,cy=133,r=32+d*.9,sc=2*r/d,w=k.b*sc,h=k.h*sc,bottom=cy-r+k.t1*sc,top=bottom-h,arrow=Math.min(112,14+m.F/65),stroke=Math.min(7,2+T/20),arcR=r+19,angle=(25+Math.min(100,T)*1.1)*Math.PI/180,start=.65,end=start+angle;
 const ax=cx+arcR*Math.cos(start),ay=cy+arcR*Math.sin(start),bx=cx+arcR*Math.cos(end),by=cy+arcR*Math.sin(end);
 const x=310,y=133,len=70+L,dx=k.b*2.4+8,dy=k.b*1.7+5,hs=5+5/k.h,kh=k.h*hs,cut=y+(k.h-k.t1)*hs;
 const statusColor=pass?'#16775d':'#b44129';
 return `<svg viewBox="0 0 574 266" role="img" aria-label="軸径${d}mm、キー${k.b}×${k.h}×${L}mm。力${fmt(m.F,1)}Nの連動図"><defs><marker id="dynamicArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c25136"/></marker></defs><text x="15" y="23" class="s">断面図</text><text x="308" y="23" class="s">キーの立体図（両角形）</text><circle cx="${cx}" cy="${cy}" r="${r+25}" fill="#dce5e9" stroke="#879ba5"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#a7cbd7" stroke="#547f91"/><rect x="${cx-w/2}" y="${top-2}" width="${w}" height="${h+2}" fill="#f8fafb" stroke="#879ba5"/><rect x="${cx-w/2}" y="${top}" width="${w}" height="${h}" fill="#f0bf55" stroke="#a77c2d"/><path d="M${cx} ${cy}V${cy-r}" stroke="#617d89" stroke-dasharray="4 3"/><circle cx="${cx}" cy="${cy}" r="3" fill="#193748"/><text x="${cx+6}" y="${cy+20}" class="s">d = ${fmt(d,1)}</text>${T>0?`<path d="M${cx} ${cy-r}h${arrow}" stroke="#c25136" stroke-width="${stroke}" marker-end="url(#dynamicArrow)"/><path d="M${ax} ${ay}A${arcR} ${arcR} 0 0 1 ${bx} ${by}" fill="none" stroke="#c25136" stroke-width="${stroke}" marker-end="url(#dynamicArrow)"/>`:''}<text x="15" y="239" class="s">T = ${fmt(T,1)} N·m</text><text x="15" y="257" class="s">F = ${fmt(m.F,1)} N</text><path d="M${x} ${y}h${len}l${dx} ${-dy}h${-len}Z" fill="#ffe3a0" stroke="#ac7d2b"/><path d="M${x} ${y}h${len}v${kh}h${-len}Z" fill="#f0bf55" stroke="#ac7d2b"/><path d="M${x+len} ${y}l${dx} ${-dy}v${kh}l${-dx} ${dy}Z" fill="#dba644" stroke="#ac7d2b"/><path d="M${x} ${cut}h${len}l${dx} ${-dy}h${-len}Z" fill="#276fba" fill-opacity=".8"/><path d="M${x} ${cut-th*hs}h${len}v${th*hs}h${-len}Z" fill="#c25136" fill-opacity=".65"/><path d="M${x} ${cut}h${len}v${ts*hs}h${-len}Z" fill="#087f8c" fill-opacity=".7"/><path d="M${x} ${y+kh+20}h${len}M${x} ${y+kh+14}v12M${x+len} ${y+kh+14}v12" stroke="#617d89"/><text x="308" y="${y+kh+42}" class="s">lₑ = ${fmt(L,1)} mm</text><text x="308" y="66" class="s">幅 b = ${k.b} ／ 高さ h = ${k.h} mm</text><text x="308" y="89" class="s">面積 b lₑ = ${fmt(k.b*L,1)} mm²</text><circle cx="302" cy="246" r="4" fill="${statusColor}"/><text x="313" y="251" class="s">色付きの面が荷重を受ける</text></svg>`;
}
function update(){const k=currentKey(),ids=[...basic,...basis],v=ids.map(id=>Number(el(id).value)),[d,T,L,nreq,r0,r1,r2,ts,th]=v;
 const invalid=ids.some(id=>el(id).value.trim()==='')||v.some(n=>!Number.isFinite(n))||d<10.1||d>44||T<0||T>100||L<k.min||L>k.max||nreq<1||nreq>5||[r0,r1,r2].some(n=>n<=0||n>10000)||ts<=0||ts>k.t1+1e-9||th<=0||th>k.h-k.t1+1e-9;
 el('heightNote').textContent=`${k.b}×${k.h}：公称近似は軸側${k.t1}、ハブ側${fmt(k.h-k.t1,1)} mm。これ以下の有効高さを指定。`;
 const rec=keys.find(q=>d>q.d0&&d<=q.d1);el('recommend').textContent=rec?`軸径の目安：${rec.b} × ${rec.h} mm`:'軸径の範囲を確認';
 el('lengthNote').textContent=`長さ ${k.min}～${k.max} mm（1 mm刻み）`;
 if(invalid){el('results').innerHTML='<div class="status bad">入力値を確認してください</div><p class="tiny">各欄の範囲内で入力してください。基準強さは0超～10000 MPa。有効接触高さは公称近似以下です。</p>';el('liveFigure').innerHTML='<div class="invalid-figure">入力が有効になると図を更新します</div>';el('basisResult').innerHTML='<p>入力値が無効なため判定を停止しています。</p>';return}
 const m=model(k,d,T,L,ts,th,[r0,r1,r2],nreq),pass=m.minimum>=nreq,compatible=d>k.d0&&d<=k.d1,critical=m.safety.indexOf(m.minimum);
 el('liveFigure').innerHTML=live(k,d,T,L,m,ts,th,pass);
 el('results').innerHTML=`<div class="sf-cards">${m.safety.map((n,i)=>`<div class="sf-card"><div>${names[i]}</div><strong style="color:${n<nreq?'#b44129':['#276fba','#087f8c','#c25136'][i]}">${fmt(n)}</strong><div class="sf-track"><i style="width:${Math.min(100,n/(2*nreq)*100)}%;background:${n<nreq?'#b44129':'#087f8c'}"></i><b></b></div><small>応力 ${fmt(m.stress[i])} MPa</small></div>`).join('')}</div><div class="sim-status ${pass?'':'bad'}">${pass?'設定条件を満たす':'必要安全率に不足'}：最小 n = ${fmt(m.minimum)} ${pass?'≥':'<'} ${fmt(nreq,1)}</div><div class="tiny">${T===0?'無負荷：応力0、安全率は∞として表示。':`厳しい条件：${names[critical]} ／ 必要有効長さ ${fmt(m.required)} mm`}${compatible?'':'<br><b class="bad">軸径とキーの参考範囲が不一致。寸法適合は要確認。</b>'}</div><div class="tiny">各バーの中央線＝必要安全率。数値は設定した基準値に対する安全率。</div>`;
 el('basisResult').innerHTML=`<h2 style="font-size:19px">現在の条件：${k.b} × ${k.h} × ${fmt(L,1)} mm</h2><p class="small">必要安全率 n_req = <b>${fmt(nreq,1)}</b><br>安全率の最小値 = <b class="${pass?'ok':'bad'}">${fmt(m.minimum)}</b></p><div class="formula" style="font-size:20px;padding:10px">許容値 = 基準強さ ÷ n_req</div><p class="small">τₐ = ${fmt(r0,1)} ÷ ${fmt(nreq,1)} = ${fmt(r0/nreq)} MPa<br>pₐₛ = ${fmt(r1/nreq)} MPa ／ pₐₕ = ${fmt(r2/nreq)} MPa</p><p class="small">必要長さ：${m.need.map(n=>fmt(n)).join(' / ')} mm<br><b>最大 ${fmt(m.required)} mm ${m.required<=L?'≤':'>'} 選択 ${fmt(L,1)} mm</b></p><p class="tiny">前ページの図・安全率・判定へ即時反映。${compatible?'':'軸径とキーの組合せは参考範囲外。'}</p>`;
}
basic.forEach(id=>{el(id+'bar').addEventListener('input',()=>{el(id).value=el(id+'bar').value;if(id==='d')selectFromDiameter();update()});el(id).addEventListener('input',()=>{if(el(id).value!==''&&Number.isFinite(Number(el(id).value)))el(id+'bar').value=el(id).value;if(id==='d')selectFromDiameter();update()})});
basis.forEach(id=>el(id).addEventListener('input',update));el('key').addEventListener('change',()=>{el('auto').checked=false;configureKey();update()});el('auto').addEventListener('change',()=>{selectFromDiameter();update()});
el('reset').addEventListener('click',()=>{el('key').value=1;el('auto').checked=true;[14,10,15,2].forEach((v,i)=>{el(basic[i]).value=v;el(basic[i]+'bar').value=v});[80,160,120].forEach((v,i)=>el(['refTau','refS','refH'][i]).value=v);configureKey();update()});
function fit(){document.querySelectorAll('.frame').forEach(f=>{const s=f.clientWidth/960;f.style.height=720*s+'px';f.firstElementChild.style.transform=`scale(${s})`})}
configureKey();update();fit();window.addEventListener('resize',fit);if(document.fonts)document.fonts.ready.then(fit);
</script>
</body>
</html>
