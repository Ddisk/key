<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>平行キーの選定と強度計算</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#203442;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{width:min(100%,1080px);margin:auto}.wrap{position:relative;margin:24px 0}.page{width:960px;height:720px;padding:38px 44px;background:#f6f8f9;position:relative;overflow:hidden;transform-origin:top left}.top{display:flex;justify-content:space-between;color:#47717f;font-size:13px;letter-spacing:2px}.page h1{font-size:32px;line-height:1.35;margin:18px 0 10px}.lead{font-size:17px;color:#536774;margin:0 0 22px}.cols{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:start}.card{background:white;border:1px solid #dce5e8;border-radius:14px;padding:20px}.card h2{font-size:20px;margin:0 0 12px}p{font-size:17px;line-height:1.7;margin:10px 0}.formula{font-size:26px;background:#e7f3f4;border-left:4px solid #087f8c;padding:16px;margin:14px 0;font-family:Georgia,serif}.small{font-size:13px;line-height:1.6;color:#536774}.note{background:#fff1d4;border-left:4px solid #e1a539;padding:12px 15px;font-size:15px;line-height:1.6;margin-top:16px}.foot{position:absolute;bottom:22px;left:44px;right:44px;display:flex;justify-content:space-between;font-size:12px;color:#647b86;border-top:1px solid #d6e1e4;padding-top:10px}svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif;font-size:17px;fill:#203442}table{width:100%;border-collapse:collapse;font-size:16px}th,td{text-align:center;padding:9px 6px;border-bottom:1px solid #dae3e6}th{background:#e8eff2;font-weight:600}.sel{background:#d9f1ef;font-weight:700}.steps{display:grid;gap:10px}.step{background:white;border:1px solid #dce5e8;border-radius:10px;padding:13px 16px;display:flex;gap:16px;align-items:center}.step b{display:grid;place-items:center;background:#087f8c;color:white;width:32px;height:32px;border-radius:50%;flex-shrink:0}.step strong{font-size:18px}.step span{display:block;font-size:14px;color:#536774;margin-top:3px}.tag{color:#087f8c;font-weight:700}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}label{font-size:13px;color:#536774}input{display:block;width:100%;font:600 18px system-ui;border:1px solid #bbccd2;border-radius:6px;padding:7px;margin-top:4px;background:#fff;color:#203442}input:focus{outline:2px solid #087f8c}button{border:0;border-radius:6px;padding:9px 13px;color:white;background:#087f8c;font-size:14px;cursor:pointer}.result{font-size:17px;line-height:1.8}.ok{color:#087f69}.bad{color:#b34026}.bar{height:9px;background:#e6edef;margin:3px 0 9px;border-radius:5px}.bar i{display:block;height:100%;background:#087f8c;border-radius:5px}.refs{font-size:12px;line-height:1.7;margin-top:12px}a{color:#087f8c}.compact p{font-size:15px}.compact .formula{font-size:22px;padding:12px}.compact table{font-size:14px}.compact td,.compact th{padding:7px}.dim{font-style:italic}.legend{display:flex;gap:18px;font-size:14px;margin:12px 0}.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;border-radius:3px}.wide{font-size:22px;text-align:center;padding:15px;border-radius:10px;background:#e7f3f4;margin-top:16px}@media print{body{background:white}.wrap{margin:0!important;break-after:page;width:960px!important;height:720px!important}.page{transform:none!important}@page{size:254mm 190.5mm;margin:0}button{display:none}}
</style>
<main id="deck"></main>
<script>
const deck=document.querySelector('#deck');
function page(n,title,lead,body){deck.insertAdjacentHTML('beforeend',`<div class="wrap"><section class="page" aria-label="${n} ${title}"><div class="top"><span>MECHANICAL DESIGN / PARALLEL KEY</span><span>平行キー</span></div><h1>${title}</h1><p class="lead">${lead}</p>${body}<div class="foot"><span>キーの選定と強度計算</span><span>${String(n).padStart(2,'0')} / 09</span></div></section></div>`)}
function svg(body){return `<svg viewBox="0 0 440 350" role="img" aria-label="キーと作用する力の説明図"><defs><marker id="arr${++uid}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c55b36"/></marker></defs>${body.replaceAll('ARROW',`url(#arr${uid})`)}</svg>`}let uid=0;
function cross(force=false){return svg(`<circle cx="210" cy="170" r="145" fill="#e1e9ed" stroke="#8198a5" stroke-width="2"/><circle cx="210" cy="170" r="94" fill="#a9c4d1" stroke="#547d91" stroke-width="2"/><rect x="185" y="51" width="50" height="63" fill="#f1b74b" stroke="#9b7028" stroke-width="2"/><path d="M210 170V83" stroke="#536774" stroke-dasharray="6 4"/><circle cx="210" cy="170" r="4" fill="#203442"/><text x="218" y="149">d / 2</text><text x="182" y="232">軸</text><text x="284" y="268">ハブ</text><path d="M237 58L282 35H350" stroke="#9b7028" fill="none"/><text x="287" y="27">キー</text>${force?'<path d="M210 83H340" stroke="#c55b36" stroke-width="4" marker-end="ARROW"/><text x="282" y="70">F</text><path d="M122 179A90 90 0 0 0 248 252" fill="none" stroke="#c55b36" stroke-width="3" marker-end="ARROW"/><text x="124" y="283">T：回転させる作用</text>':'<path d="M71 136A145 145 0 0 1 135 45" fill="none" stroke="#c55b36" stroke-width="3" marker-end="ARROW"/><text x="22" y="175">回転</text>'}<text x="82" y="337">軸方向から見た断面（模式図）</text>`)}
function key(mode='size'){let shear=mode==='shear',pressure=mode==='pressure';return svg(`<path d="M65 128L280 128L367 75L152 75Z" fill="#ffe3a0" stroke="#9b7028" stroke-width="2"/><path d="M65 128H280V237H65Z" fill="#f2c96e" stroke="#9b7028" stroke-width="2"/><path d="M280 128L367 75V184L280 237Z" fill="#dba542" stroke="#9b7028" stroke-width="2"/>${shear?'<path d="M65 185H280L367 132L152 132Z" fill="#0b9aab" fill-opacity=".8" stroke="#087f8c" stroke-width="2"/><text x="116" y="165" fill="white">せん断面</text><path d="M310 95L374 54M115 219L51 260" stroke="#c55b36" stroke-width="4" marker-end="ARROW"/>':''}${pressure?'<path d="M65 128H280V172H65Z" fill="#c55b36" fill-opacity=".8"/><path d="M65 175H280V237H65Z" fill="#087f8c" fill-opacity=".8"/><text x="120" y="158">ハブ側：tₕ × lₑ</text><text x="120" y="215">軸側：tₛ × lₑ</text>':''}<path d="M65 264H280M302 250L389 197M40 128V237" stroke="#536774" stroke-width="1.5"/><text x="143" y="290">${mode==='size'?'l：全長':'lₑ：有効長さ'}</text><text x="353" y="250">b</text><text x="18" y="187">h</text><text x="80" y="329">両角形：両端が四角い平行キー</text>`)}
page(1,'回転を伝える、小さな部品','軸とハブの溝にはめ込み、側面で力を受け渡す。',`<div class="cols"><div class="card">${cross()}<div class="legend"><span><i style="background:#a9c4d1"></i>軸</span><span><i style="background:#f1b74b"></i>キー</span><span><i style="background:#d1dfe5"></i>ハブ</span></div></div><div><div class="card"><h2>キーが受ける2つの作用</h2><p><b class="tag">せん断</b><br>軸とハブが逆向きに押し、キーをずらして切ろうとする。</p><p><b style="color:#c55b36">面圧</b><br>キーと溝の側面が押し合い、接触部をつぶそうとする。</p></div><div class="note">幅・高さを選ぶだけでなく、両方の強度を確認して長さを決める。</div><p class="small">対象：1本の平行キーによるトルク伝達。ハブは歯車・プーリなどの軸に取り付く部分。</p></div></div>`);
page(2,'キーの選定は、この順番','規格で寸法を仮選定し、計算で成立するか確かめる。',`<div class="steps">${[['軸径・既存のキー溝を確認','既製モータや相手部品の溝が決まっていれば、その寸法を優先。'],['JIS表から幅 b・高さ h を仮選定','適応軸径は一般用途の目安。規格寸法だけでは強度は決まらない。'],['設計用トルク・材質・許容値を決定','起動・加速・停止・正逆転を考慮。キー・軸・ハブの材質を確認。'],['せん断・面圧から必要な長さを計算','3つの条件から得た必要有効長さの、最大値を採用。'],['取り付けと強度を確認して決定','ハブ長さ、溝長さ、端形状、はめあい、軸の強度を確認。']].map((s,i)=>`<div class="step"><b>${i+1}</b><div><strong>${s[0]}</strong><span>${s[1]}</span></div></div>`).join('')}</div><div class="note">長さを確保できない場合は、材質や軸・ハブ寸法を見直して再計算する。キー溝による軸の応力集中・疲労も別途確認する。</div>`);
page(3,'JIS表から、幅と高さを選ぶ','JIS B 1301:1996 のメーカー公開抜粋を整理。単位：mm',`<table><thead><tr><th>幅 b × 高さ h</th><th>適応軸径 d（参考）</th><th>長さ l の範囲</th><th>軸溝深さ t₁</th><th>ハブ溝深さ t₂</th></tr></thead><tbody>${[['4 × 4','10～12','8～45','2.5','1.8'],['5 × 5','12～17','10～56','3.0','2.3'],['6 × 6','17～22','14～70','3.5','2.8'],['8 × 7','22～30','18～90','4.0','3.3'],['10 × 8','30～38','22～110','5.0','3.3'],['12 × 8','38～44','28～140','5.0','3.3']].map((r,i)=>`<tr class="${i===1?'sel':''}">${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="note"><b>今回：5 × 5 × 15 mm、両角形</b><br>5×5の推奨長さ系列：10, 12, 14, 16, 18, 20, 22, 25, 28, 32, 36, 40, 45, 50, 56。<br>15 mmは範囲内だが推奨系列外。今回は指定長さとして計算する。</div><p class="small">規格全体の一部を掲載。適応軸径は参考値であり、強度確認が必要。新旧JISの寸法を混用せず、寸法許容差・はめあいは採用品の図面で確認する。</p><div class="refs">出典：<a href="https://www.khkgears.co.jp/gear_technology/gear_reference/khk495/" target="_blank" rel="noopener">KHK「キー及びキー溝」</a> ／ <a href="https://jp.misumi-ec.com/tech-info/categories/technical_data/td01/a0061.html" target="_blank" rel="noopener">MISUMI「沈みキー及びキー溝」</a>（いずれも1996年版抜粋。最新版の適合証明ではない）</div>`);
page(4,'寸法と「有効長さ」を区別する','全長ではなく、軸とハブの双方で力を伝えられる部分を使う。',`<div class="cols"><div class="card">${key()}<p class="small">図の寸法は記号。例題のみ5×5×15 mm。</p></div><div class="card compact"><h2>使用する記号</h2><table><tr><th>記号</th><th>意味</th><th>単位</th></tr>${[['d','軸径','mm'],['b, h','キーの幅・高さ','mm'],['l, lₑ','全長・有効長さ','mm'],['T_d','設計用トルク','N·m'],['F','接線方向の力','N'],['tₛ, tₕ','各側の有効接触高さ','mm']].map(r=>`<tr>${r.map(t=>`<td>${t}</td>`).join('')}</tr>`).join('')}</table><div class="note">両角形でも、全長がかみ合う場合に限り lₑ = l。ハブからの突出や逃げの部分は除く。</div></div></div>`);
page(5,'トルクを、キーに働く力へ','トルク ＝ 力 × 回転中心からの距離。',`<div class="cols"><div class="card">${cross(true)}<p class="small">力の作用半径を d/2 とする基本モデル。</p></div><div><div class="formula">1000 T_d = F × d / 2<br><b>F = 2000 T_d / d</b></div><p>T_d：N·m、d：mm、F：N<br>1000は N·m → N·mm の換算。</p><div class="card compact"><h2>どのトルクを使う？</h2><p>定格運転だけでなく、実際にキーが受ける起動・加減速時などの最大負荷を評価する。</p><p>動力から求める場合：<br><b>T ≈ 9550 P / n</b><br>P：kW、n：min⁻¹（n &gt; 0）</p></div><p class="small">使用係数を掛ける場合は基準トルクと根拠を明記し、ピークトルクとの重複加算を避ける。</p></div></div>`);
page(6,'せん断：幅 × 長さで受ける','キーをずらして切ろうとする力を、青い面で支える。',`<div class="cols"><div class="card">${key('shear')}<p class="small">青い面：せん断面 Aτ = b lₑ</p></div><div><div class="formula">τ = F / (b lₑ)<br>= 2000 T_d / (d b lₑ)</div><p>τ：せん断応力 [MPa]<br>1 N/mm² = 1 MPa</p><div class="card"><h2>許容値以下なら成立</h2><p><b>τ ≤ τₐ</b></p><p>τₐ：キーの許容せん断応力。材質・熱処理・繰返し条件と必要な余裕から設定する。</p></div><div class="note">必要長さへ変形：<br><b>lₑ ≥ F / (b τₐ)</b></div></div></div>`);
page(7,'面圧：側面の高さ × 長さで受ける','キーと溝が押し合う。軸側とハブ側をそれぞれ確認する。',`<div class="cols"><div class="card">${key('pressure')}<p class="small">色分けした側面の面積で評価。軸側とハブ側は実際には反対側の側面から力を受ける。</p></div><div class="compact"><div class="formula">pₛ = F / (tₛ lₑ) ≤ pₐₛ<br>pₕ = F / (tₕ lₑ) ≤ pₐₕ</div><p>pₐₛ, pₐₕ：各接触部の許容面圧 [MPa]。キーと相手材の双方を考慮する。</p><div class="card"><h2>溝深さ ≠ 接触高さ</h2><p>平面近似の公称高さは、<br><b>軸側 ≈ t₁<br>ハブ側 ≈ h − t₁</b></p><p>ハブ溝深さ t₂ には上部すきまを含むため、そのまま接触高さには使わない。</p></div><p class="small">実際の有効高さは面取り、溝底R、軸の曲率、寸法公差などで減る。h/2を使う方法も近似。図面に基づき有効高さを設定する。</p></div></div>`);
page(8,'必要な長さは、3条件の最大値','せん断だけで決めず、軸側・ハブ側の面圧も比較する。',`<table><tr><th>確認する条件</th><th>必要有効長さ</th><th>対応する許容値</th></tr><tr><td>キーのせん断</td><td>lτ = F / (b τₐ)</td><td>キーの τₐ</td></tr><tr><td>軸側の面圧</td><td>lₛ = F / (tₛ pₐₛ)</td><td>軸とキーの接触部 pₐₛ</td></tr><tr><td>ハブ側の面圧</td><td>lₕ = F / (tₕ pₐₕ)</td><td>ハブとキーの接触部 pₐₕ</td></tr></table><div class="wide"><b>必要有効長さ l_req = max(lτ, lₛ, lₕ)</b></div><div class="cols" style="margin-top:20px"><div class="card"><h2>長さと取り付けを確認</h2><p>lₑ ≥ l_req を満たす寸法を選び、ハブ内に十分な接触長さがあるか確認する。</p><p class="small">長いキーでは荷重の偏りも考慮。均等分布の式だけで、無制限に長さを増やさない。</p></div><div class="card"><h2>許容値に対する余裕倍率</h2><p>Rτ = τₐ / τ<br>Rₛ = pₐₛ / pₛ　 Rₕ = pₐₕ / pₕ</p><p class="small">各倍率が1以上なら設定した許容値内。許容値に安全率を含む場合、この倍率は材料強度に対する安全率そのものではない。</p></div></div><div class="refs">式の参考：<a href="https://www.eng-book.com/ebw/IntensityOfKey_shear_calculation.do?category=shear" target="_blank" rel="noopener">兵神装備 エンジニアズブック「キーの強さ」</a>。本資料は接触高さを各側に分けた均等荷重モデル。</div>`);
page(9,'例題：両角形 5 × 5 × 15 mm','入力を変更すると、力・応力・必要長さが連動して変わる。',`<div class="cols"><div><div class="card compact"><h2>b = 5、h = 5 mm（固定）</h2><div class="inputs">${[['d','軸径 d [mm]',14],['T','T_d [N·m]',10],['L','全長＝lₑ [mm]',15],['ts','接触高さ tₛ [mm]',3],['th','接触高さ tₕ [mm]',2],['ta','τₐ [MPa]',40],['ps','pₐₛ [MPa]',80],['ph','pₐₕ [MPa]',60]].map(r=>`<label>${r[1]}<input id="${r[0]}" type="number" step="any" min="0" value="${r[2]}"></label>`).join('')}</div><p class="small">長さ10～56 mm。全長が有効な両角形を想定。</p><button id="reset">例題の値に戻す</button></div><div class="note" style="font-size:13px">軸径14・トルク10は仮定。材質未指定のため許容値40/80/60 MPaは教材用で、特定材質の保証値ではない。<br>初期接触高さ3/2 mmは t₁=3、h=5 の公称近似。面取り等を反映する場合は有効高さを変更する。</div></div><div class="card compact"><h2 id="status">計算結果</h2><div id="out" aria-live="polite"></div></div></div>`);
const ids=['d','T','L','ts','th','ta','ps','ph'],defaults=[14,10,15,3,2,40,80,60];
function calc(){let v=ids.map(id=>Number(document.getElementById(id).value));let [d,T,L,ts,th,ta,ps,ph]=v;let out=document.querySelector('#out'),status=document.querySelector('#status');if(ids.some(id=>!document.getElementById(id).value.trim())||v.some(x=>!Number.isFinite(x)||x<=0)||L<10||L>56||ts+th>5||d<=5){status.textContent='入力を確認してください';status.className='bad';out.innerHTML='<p>すべて正の数、長さ10～56 mm、軸径5 mm超で入力してください。接触高さの合計はキー高さ5 mm以下です。</p>';return}let F=2000*T/d,stress=[F/(5*L),F/(ts*L),F/(th*L)],allow=[ta,ps,ph],need=[F/(5*ta),F/(ts*ps),F/(th*ph)],mx=Math.max(...need),ok=L>=mx;status.textContent=ok?'設定した簡易モデルでは許容値内':'設定した許容値を超えています';status.className=ok?'ok':'bad';let names=['せん断 τ','軸側面圧 pₛ','ハブ側面圧 pₕ'];out.innerHTML=`<p><b>F = 2000 × ${T} / ${d}<br> = ${F.toFixed(1)} N</b></p><table><tr><th>条件</th><th>応力 MPa</th><th>余裕倍率</th></tr>${stress.map((s,i)=>`<tr><td>${names[i]}</td><td>${s.toFixed(2)}</td><td class="${allow[i]>=s?'ok':'bad'}">${(allow[i]/s).toFixed(2)}</td></tr>`).join('')}</table><p class="small">せん断面積：${(5*L).toFixed(1)} mm²<br>接触面積：軸側 ${(ts*L).toFixed(1)} / ハブ側 ${(th*L).toFixed(1)} mm²</p><b style="font-size:15px">必要有効長さ（棒の全幅＝選択長さ）</b>${need.map((n,i)=>`<div class="small">${names[i]}：${n.toFixed(2)} mm</div><div class="bar"><i style="width:${Math.min(100,n/L*100)}%;background:${n>L?'#c55b36':'#087f8c'}"></i></div>`).join('')}<p><b>l_req = ${mx.toFixed(2)} mm ${ok?'≤':'>'} ${L} mm</b></p><p class="small">${d>12&&d<=17?'軸径は5×5の適応軸径の目安内。':'軸径は5×5の参考範囲（12超～17以下）外。溝・軸の設計を再確認。'}<br>均等荷重・入力した有効高さでの計算。実機の採用判定には材質、疲労、溝形状の確認が必要。</p>`}
ids.forEach(id=>document.getElementById(id).addEventListener('input',calc));document.querySelector('#reset').onclick=()=>{ids.forEach((id,i)=>document.getElementById(id).value=defaults[i]);calc()};calc();
function fit(){document.querySelectorAll('.wrap').forEach(w=>{let s=w.clientWidth/960;w.style.height=720*s+'px';w.firstElementChild.style.transform=`scale(${s})`})}addEventListener('resize',fit);fit();
</script>
</html>
